name: Build Debug & Signed Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deepak-video-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-release:
    name: Build Signed Release APK & AAB
    needs: build-debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release signing secrets
        id: check_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed Release build skipped: add KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub Repository Secrets (with key alias 'upload')."
            {
              echo "### Signed Release Build Skipped"
              echo "Add these GitHub Repository Secrets (**Settings → Secrets and variables → Actions**):"
              echo "- \`KEYSTORE_BASE64\` (base64 of \`my-upload-key.jks\` with alias \`upload\`)"
              echo "- \`STORE_PASSWORD\`"
              echo "- \`KEY_PASSWORD\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK 17
        if: steps.check_signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.check_signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Decode Release Keystore
        if: steps.check_signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"

      - name: Build Signed Release APK & AAB
        if: steps.check_signing.outputs.configured == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          ADMOB_ARGS=()
          if [ -n "$ADMOB_APP_ID" ]; then ADMOB_ARGS+=("-PADMOB_APP_ID=$ADMOB_APP_ID"); fi
          if [ -n "$ADMOB_BANNER_ID" ]; then ADMOB_ARGS+=("-PADMOB_BANNER_ID=$ADMOB_BANNER_ID"); fi
          if [ -n "$ADMOB_INTERSTITIAL_ID" ]; then ADMOB_ARGS+=("-PADMOB_INTERSTITIAL_ID=$ADMOB_INTERSTITIAL_ID"); fi
          if [ -n "$ADMOB_REWARDED_ID" ]; then ADMOB_ARGS+=("-PADMOB_REWARDED_ID=$ADMOB_REWARDED_ID"); fi

          gradle :app:assembleRelease :app:bundleRelease "${ADMOB_ARGS[@]}"

      - name: Clean up Release Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"

      - name: Upload Signed Release APK
        if: steps.check_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deepak-video-player-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Signed Release AAB
        if: steps.check_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deepak-video-player-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

